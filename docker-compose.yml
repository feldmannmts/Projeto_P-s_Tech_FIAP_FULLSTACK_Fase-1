services:
  db:
    image: postgres:16-alpine
    container_name: quimiport_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: quimiport
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d quimiport"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: quimiport_api
    restart: always
    ports:
      - "35500:35500"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgrespassword
      DB_NAME: quimiport
    depends_on:
      db:
        condition: service_healthy